<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela de la Fuente - Llenar Jornada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 20px;
            background: linear-gradient(135deg, #0b4f6c, #1d976c);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .btn-regreso-fijo {
            position: fixed; top: 20px; right: 20px;
            background-color: #ffcc80; color: #5d4037; border: 2px solid #ffffff;
            text-decoration: none; padding: 10px 15px; border-radius: 30px; 
            font-weight: bold; font-size: 14px; z-index: 9999; box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
        }

        .container {
            background-color: #ffffff; padding: 25px 35px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            max-width: 700px; width: 100%; box-sizing: border-box;
        }

        h1 { font-family: 'Anton', sans-serif; color: #0b4f6c; text-align: center; text-transform: uppercase; margin: 0 0 20px 0; }

        .form-section { margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 25px; }
        
        .tipo-juego-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .tipo-juego-selector button {
            padding: 12px 10px; font-weight: 700; border: 2px solid #ccc;
            background-color: #f9f9f9; color: #555; border-radius: 8px; cursor: pointer;
        }
        .tipo-juego-selector button.active { background-color: #1d976c; color: white; border-color: #1d976c; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .full-width { grid-column: 1 / -1; }
        .hidden-field { display: none; }

        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; }

        .partido { display: grid; grid-template-columns: 1fr 45px auto 45px 1fr; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .equipo { font-weight: 700; font-size: 0.95em; }
        .equipo-local { text-align: right; }
        .vs-divider { font-size: 0.8em; color: #777; font-weight: 700; text-align: center; }
        .partido input { width: 100%; text-align: center; padding: 10px 5px; }
        
        #btn-enviar {
            width: 100%; padding: 16px; font-family: 'Anton', sans-serif; font-size: 1.3em;
            color: #fff; background: linear-gradient(45deg, #e74c3c, #c0392b);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }

        /* --- ESTILOS MODAL INTELIGENTE --- */
        #modal-confirmacion {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 480px; text-align: center;
        }
        .banco-info {
            background: #f1f8e9; border: 1px dashed #2e7d32; padding: 15px; border-radius: 12px; margin: 15px 0; text-align: left;
        }
        .btn-confirm { background: #1d976c; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; }
        
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30000; background: white; padding: 30px; border-radius: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1d976c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <a href="https://eduardowado.github.io/Bienvenido-Quinelas-De-La-Fuente/" class="btn-regreso-fijo">↩ Regresar</a>
    
    <div class="container">
        <h1>Quiniela de la Fuente</h1>

        <form id="quiniela-form">
            <div class="form-section">
                <label style="text-align:center; display:block; margin-bottom: 15px;">Selecciona tu tipo de juego:</label>
                <div class="tipo-juego-selector">
                    <button type="button" id="btn-tipo-temporada" data-tipo="Temporada">Temporada</button>
                    <button type="button" id="btn-tipo-semanal" data-tipo="Semanal">Semanal</button>
                    <button type="button" id="btn-tipo-ambos" data-tipo="Ambos">Ambos</button>
                </div>
                <input type="hidden" id="tipo_juego" name="tipo_juego" value="">
            </div>

            <div id="form-content" class="hidden-field">
                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Jornada:</label>
                            <select id="jornada" name="jornada" required>
                                <option value="">Selecciona...</option>
                                <script>for(let i=1;i<=17;i++){document.write(`<option value="${i}">Jornada ${i}</option>`);}</script>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha Límite:</label>
                            <input type="text" id="fecha-limite" readonly disabled style="background:#f4f4f4;">
                        </div>
                        <div class="form-group full-width hidden-field" id="group-nombre">
                            <label>Nombre:</label>
                            <input type="text" id="nombre_semanal" name="nombre_semanal" placeholder="Tu nombre">
                        </div>
                        <div class="form-group full-width hidden-field" id="group-codigo-temporada">
                            <label>Código Temporada:</label>
                            <input type="password" id="codigo_temporada" name="codigo_temporada" placeholder="Tu código">
                        </div>
                        <div class="form-group full-width hidden-field" id="group-codigo-semanal">
                            <label>Código Semanal:</label>
                            <input type="password" id="codigo_semanal" name="codigo_semanal" placeholder="Tu código">
                        </div>
                    </div>
                </div>

                <div id="partidos-container" class="form-section"></div>

                <div id="extras-container" class="form-section" style="display:none;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Total Goles:</label>
                            <input type="number" id="totalgoles" name="totalgoles" required>
                        </div>
                        <div class="form-group">
                            <label>Comodín (★):</label>
                            <select id="comodin-select" name="comodin" required></select>
                        </div>
                    </div>
                </div>

                <div id="submit-container" style="display:none;">
                    <button type="submit" id="btn-enviar">Enviar Quiniela</button>
                </div>
            </div> 
        </form>
    </div>

    <div id="modal-confirmacion">
        <div class="modal-content">
            <h2 id="modal-titulo" style="color: #0b4f6c; margin-top:0;">¿Confirmas tu envío?</h2>
            <div id="modal-body" style="margin-bottom: 20px;"></div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirm" onclick="ejecutarEnvioFinal()">Sí, Enviar</button>
            </div>
        </div>
    </div>

    <div id="loading"><div class="spinner"></div>Procesando datos...</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWENw0FxnI0WNkkX34k2AfRSOhNiBmxYodgR4fRQe5sF_4vOeCQsH_LPrv9epSiNTurQ/exec";

        const form = document.getElementById('quiniela-form');
        const tipoJuegoInput = document.getElementById('tipo_juego');
        const jornadaSelect = document.getElementById('jornada');
        
        function seleccionarTipoJuego(tipo) {
            tipoJuegoInput.value = tipo;
            document.getElementById('form-content').classList.remove('hidden-field');
            document.querySelectorAll('.tipo-juego-selector button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-tipo-' + tipo.toLowerCase()).classList.add('active');
            document.getElementById('group-nombre').classList.toggle('hidden-field', tipo !== 'Semanal');
            document.getElementById('group-codigo-temporada').classList.toggle('hidden-field', tipo === 'Semanal');
            document.getElementById('group-codigo-semanal').classList.toggle('hidden-field', tipo === 'Temporada');
        }
        
        document.getElementById('btn-tipo-temporada').onclick = () => seleccionarTipoJuego('Temporada');
        document.getElementById('btn-tipo-semanal').onclick = () => seleccionarTipoJuego('Semanal');
        document.getElementById('btn-tipo-ambos').onclick = () => seleccionarTipoJuego('Ambos');

        jornadaSelect.onchange = async () => {
            if (!jornadaSelect.value) return;
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await fetch(`${SCRIPT_URL}?jornada=${jornadaSelect.value}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    dibujarPartidos(data.partidos);
                    document.getElementById('fecha-limite').value = new Date(data.fechaLimite).toLocaleString();
                    document.getElementById('extras-container').style.display = 'block';
                    document.getElementById('submit-container').style.display = 'block';
                }
            } catch (e) { alert("Error al cargar jornada"); }
            finally { document.getElementById('loading').style.display = 'none'; }
        };

        function dibujarPartidos(partidos) {
            const cont = document.getElementById('partidos-container');
            const comodin = document.getElementById('comodin-select');
            cont.innerHTML = '';
            comodin.innerHTML = '<option value="">Selecciona comodín...</option>';
            partidos.forEach((p, i) => {
                cont.innerHTML += `<div class="partido"><span class="equipo equipo-local">${p.local}</span><input type="number" name="p${i}_local" required><span class="vs-divider">vs</span><input type="number" name="p${i}_visita" required><span class="equipo equipo-visitante">${p.visitante}</span></div>`;
                comodin.innerHTML += `<option value="${i+1}">P${i+1}: ${p.local} vs ${p.visitante}</option>`;
            });
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const tipo = tipoJuegoInput.value;
            const jornada = parseInt(jornadaSelect.value);
            const codTemp = document.getElementById('codigo_temporada').value;

            document.getElementById('loading').style.display = 'block';
            let infoDeuda = { deuda: 0, bloqueado: false, permitido: false };
            
            if ((tipo === 'Temporada' || tipo === 'Ambos') && codTemp) {
                try {
                    const res = await fetch(`${SCRIPT_URL}?accion=verificarDeuda&codigo=${codTemp}&jornada=${jornada}`);
                    infoDeuda = await res.json();
                } catch (err) { console.error(err); }
            }
            document.getElementById('loading').style.display = 'none';

            // Evaluamos en qué estado mostrar el Modal
            if (infoDeuda.bloqueado) {
                mostrarConfirmacion('BLOQUEO', infoDeuda);
            } else if (infoDeuda.permitido && infoDeuda.deuda > 0) {
                mostrarConfirmacion('PERMITIDO_CON_DEUDA', infoDeuda); // <-- NUEVO ESTADO ESPECIAL
            } else if (infoDeuda.deuda > 0) {
                mostrarConfirmacion('ADVERTENCIA', infoDeuda);
            } else {
                mostrarConfirmacion('LIMPIO', infoDeuda);
            }
        };

        function mostrarConfirmacion(estado, info) {
            const body = document.getElementById('modal-body');
            const titulo = document.getElementById('modal-titulo');
            const btnConfirm = document.querySelector('.btn-confirm');
            
            titulo.style.color = (estado === 'BLOQUEO') ? '#e74c3c' : '#0b4f6c';
            btnConfirm.style.display = (estado === 'BLOQUEO') ? 'none' : 'block';

            if (estado === 'LIMPIO') {
                body.innerHTML = `<p style="font-weight:bold;">✅ ¡Tu cuenta está al corriente!</p>
                                  <p>Recuerda revisar bien tus resultados antes de enviar.<br>¿Estás seguro de tu pronóstico?</p>`;
            } 
            else if (estado === 'PERMITIDO_CON_DEUDA') {
                // El diseño solicitado por ti para pases de administrador con deuda
                body.innerHTML = `
                    <p style="color:#1d976c; font-weight:bold; font-size:1.2em;">⭐ PERMISO ESPECIAL ACTIVO</p>
                    <p style="font-weight:bold; color:#e67e22; margin: 10px 0;">PAGO PENDIENTE: Debes $${info.deuda}</p>
                    <p style="font-size:0.95em; line-height:1.4; color:#555;">Permiso del administrador con el envio de quiniela despues de la Jornada 8 con deuda pendiente !! Favor de pagar lo antes posible !!</p>
                    <div class="banco-info">
                        <b>NU México</b> | Eduardo De La Fuente<br>
                        CLABE: <span id="clabe-txt" style="font-weight:bold;">638180000010006302</span>
                        <button onclick="copiarClabe()" style="background:#0b4f6c; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer; margin-left:5px;">COPIAR</button>
                    </div>
                    <a href="https://wa.me/528131071919?text=Hola Eduardo, gracias por el pase VIP para la quiniela. Aquí tengo pendiente mi saldo de $${info.deuda}" target="_blank" style="color:#25D366; font-size:12px; font-weight:bold; text-decoration:none;">📲 Enviar comprobante por WhatsApp</a>
                    <p style="margin-top:15px; font-weight:bold;">¿Deseas enviar tus resultados ahora?</p>
                `;
            }
            else if (estado === 'ADVERTENCIA') {
                body.innerHTML = `
                    <p style="color:#e67e22; font-weight:bold; font-size:1.2em;">⚠️ PAGO PENDIENTE: Debes $${info.deuda}</p>
                    <p style="font-size:0.9em;">Recuerda pagar antes de la <b>Jornada ${info.jornadaLimite}</b> para evitar el bloqueo automático de tu código.</p>
                    <div class="banco-info">
                        <b>NU México</b> | Eduardo De La Fuente<br>
                        CLABE: <span id="clabe-txt" style="font-weight:bold;">638180000010006302</span>
                        <button onclick="copiarClabe()" style="background:#0b4f6c; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer; margin-left:5px;">COPIAR</button>
                    </div>
                    <a href="https://wa.me/528131071919?text=Hola Eduardo, envío comprobante de mi saldo pendiente ($${info.deuda})" target="_blank" style="color:#25D366; font-size:12px; font-weight:bold; text-decoration:none;">📲 Enviar comprobante por WhatsApp</a>
                    <p style="margin-top:15px; font-weight:bold;">¿Deseas enviar tus resultados ahora?</p>
                `;
            }
            else if (estado === 'BLOQUEO') {
                body.innerHTML = `
                    <p style="color:#e74c3c; font-weight:bold;">🛑 ACCESO BLOQUEADO</p>
                    <p>${info.motivo}</p>
                    <div class="banco-info">
                        <b>NU México</b> | CLABE: 638180000010006302
                        <button onclick="copiarClabe()" style="background:#0b4f6c; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">COPIAR</button>
                    </div>
                    <a href="https://wa.me/528131071919?text=Hola Eduardo, mi cuenta está bloqueada y debo $${info.deuda}. Deseo liquidar." target="_blank" style="color:#25D366; font-size:12px; font-weight:bold; text-decoration:none;">📲 Informar pago al Administrador</a>
                `;
            }
            document.getElementById('modal-confirmacion').style.display = 'flex';
        }

        async function ejecutarEnvioFinal() {
            cerrarModal();
            document.getElementById('loading').style.display = 'block';
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.accion = "enviarPronostico";
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(data) });
                const json = await res.json();
                alert(json.message);
                if (json.status === 'ok') location.reload();
            } catch (e) { alert("Error al enviar"); }
            finally { document.getElementById('loading').style.display = 'none'; }
        }

        function cerrarModal() { document.getElementById('modal-confirmacion').style.display = 'none'; }
        function copiarClabe() { navigator.clipboard.writeText("638180000010006302"); alert("✅ CLABE copiada"); }
    </script>
</body>
</html>
